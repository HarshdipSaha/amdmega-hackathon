[project]
name = "roadread"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pillow>=10", "pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pymupdf>=1.24"]
gpu = ["amdsmi"]
mcp = ["mcp>=1.2"]

[tool.setuptools.packages.find]
include = ["roadread*", "silentpath*", "gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
