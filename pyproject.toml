[project]
name = "silentpath"
version = "0.1.0"
description = "Evidence-backed AMD inference-path comparison and cost measurement"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pillow>=10", "pydantic>=2.7", "PyYAML>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.scripts]
silentpath = "silentpath.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pymupdf>=1.24", "openpyxl>=3.1", "numpy>=1.26"]
gpu = ["amdsmi", "transformers==5.17.0"]
mcp = ["mcp>=1.2"]

[tool.setuptools.packages.find]
include = ["roadread*", "silentpath*", "gate*", "sourcebound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
